<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Escrevente TJSP: estudo por questões</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0b5c63">
<style>
:root{--bg:#f2f5f7;--fg:#14202b;--mut:#5d6b78;--card:#fff;--bd:#d3dbe2;--ac:#0b5c63;--acf:#fff;--ok:#1b7a43;--okb:#e3f4ea;--no:#b3261e;--nob:#fbe8e6}
@media(prefers-color-scheme:dark){:root{--bg:#0f161c;--fg:#e8eef3;--mut:#93a3b1;--card:#18222b;--bd:#2c3a46;--ac:#58c4cc;--acf:#06262a;--ok:#6fcf97;--okb:#12291b;--no:#f28b82;--nob:#331a18}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:700px;margin:0 auto;padding:12px 14px 40px}
.top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px}
.stat{color:var(--mut);font-size:14px}
select,button,input{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:8px 10px}
button{cursor:pointer}button.p{background:var(--ac);color:var(--acf);border-color:var(--ac)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.f{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.q{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:16px}
.meta{color:var(--mut);font-size:14px;margin:0 0 8px}
.en{font:19px/1.55 Georgia,"Times New Roman",serif;margin:0 0 14px}
.alt{display:block;width:100%;text-align:left;margin:0 0 10px;padding:10px 12px;background:var(--bg)}
.alt b{display:inline-block;width:1.6em}
.alt.ok{border-color:var(--ok);background:var(--okb)}.alt.no{border-color:var(--no);background:var(--nob)}
.ex{margin:-4px 0 12px;padding:0 4px 0 14px;font-size:15px;color:var(--mut);border-left:3px solid var(--bd)}
.ex.ok{border-color:var(--ok);color:var(--fg)}.ex.no{border-color:var(--no);color:var(--fg)}
.res{font-weight:600;margin:4px 0 12px}.res.ok{color:var(--ok)}.res.no{color:var(--no)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}.row .sp{flex:1}
dialog{max-width:520px;width:calc(100% - 28px);border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--fg);padding:18px}
dialog::backdrop{background:#0008}
dialog h2{font-size:15px;color:var(--mut);margin:0 0 8px;font-weight:600}
dialog h3{font:600 20px/1.3 Georgia,serif;margin:0 0 8px}
dialog p{margin:0 0 14px}
input{width:100%}#st{font-size:13px;color:var(--mut)}
</style></head><body><main>
<div class="top"><strong>Escrevente TJSP</strong><span class="stat" id="stat"></span></div>
<div class="f">
 <select id="fm" aria-label="Matéria"></select>
 <select id="fo" aria-label="Modo"><option value="all">Todas</option><option value="new">Não respondidas</option><option value="err">Que errei</option></select>
 <button id="cfg">Sincronização</button>
</div>
<div class="q" id="box"></div>
</main>
<dialog id="dm"><h2 id="dt"></h2><h3 id="dh"></h3><p id="dp"></p>
 <div class="row"><button id="dpv">Anterior</button><button id="dnx">Próximo</button><span class="sp"></span><button class="p" id="dx">Fechar</button></div></dialog>
<dialog id="dc"><h3>Sincronizar progresso</h3>
 <p>Cole o endereço do aplicativo da Web (Apps Script) para continuar de onde parou em outro aparelho.</p>
 <input id="url" placeholder="https://script.google.com/macros/s/.../exec">
 <p id="st"></p>
 <div class="row"><button id="sv" class="p">Salvar e sincronizar</button><span class="sp"></span><button id="cx">Fechar</button></div></dialog>
<script src="questoes.js"></script>
<script>
const K='escrevente.v1',$=s=>document.querySelector(s),Q=window.QUESTOES,T=window.TOPICOS;
let S=JSON.parse(localStorage.getItem(K)||'{"q":{},"last":null,"t":0}'),cfg=JSON.parse(localStorage.getItem(K+'.cfg')||'{}'),pool=[],i=0,ci=0,tm;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const status=m=>$('#st').textContent=m;
function save(){S.t=Date.now();localStorage.setItem(K,JSON.stringify(S));push()}
function push(){if(!cfg.url)return;clearTimeout(tm);tm=setTimeout(()=>fetch(cfg.url,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(S)}).then(()=>status('Sincronizado.')).catch(()=>status('Falha ao enviar. Verifique o endereço.')),1200)}
function merge(r){for(const id in(r.q||{}))if(!S.q[id]||r.q[id].t>S.q[id].t)S.q[id]=r.q[id];if((r.t||0)>S.t&&r.last)S.last=r.last;S.t=Math.max(S.t,r.t||0)}
async function pull(){if(!cfg.url)return;try{merge(await(await fetch(cfg.url)).json());localStorage.setItem(K,JSON.stringify(S));status('Sincronizado.');build(true)}catch(e){status('Falha ao baixar. Verifique o endereço.')}}
const ans=q=>S.q[q.id]&&S.q[q.id].a!=null?S.q[q.id]:null;
function build(keep){
 const m=$('#fm').value,o=$('#fo').value;
 pool=Q.filter(q=>(m==='all'||q.m===m)&&(o==='all'||(o==='new'?!ans(q):ans(q)&&!ans(q).ok)));
 i=keep?Math.max(0,pool.findIndex(q=>q.id===S.last)):0;render()}
function stats(){const a=Q.filter(ans),c=a.filter(q=>ans(q).ok).length;$('#stat').textContent=a.length+' de '+Q.length+' respondidas'+(a.length?' · '+Math.round(100*c/a.length)+'% de acerto':'')}
function render(){
 stats();const q=pool[i],box=$('#box');
 if(!q){box.innerHTML='<p>Nenhuma questão neste filtro.</p>';return}
 S.last=q.id;const r=ans(q),L='ABCDE';
 box.innerHTML='<p class="meta">'+esc(q.m)+' · '+esc(q.ref)+' · questão '+(i+1)+' de '+pool.length+'</p><p class="en">'+esc(q.q)+'</p>'+
 q.a.map((t,k)=>{const cl=r?(k===q.g?'ok':(k===r.a?'no':'')):'';
  return '<button class="alt '+cl+'" data-k="'+k+'"'+(r?' disabled':'')+'><b>'+L[k]+')</b>'+esc(t)+'</button>'+(r?'<p class="ex '+cl+'">'+esc(q.e[k])+'</p>':'')}).join('')+
 (r?'<p class="res '+(r.ok?'ok':'no')+'">'+(r.ok?'Correto.':'Errado. Gabarito: '+L[q.g]+'.')+'</p>':'')+
 '<div class="row"><button id="pv"'+(i?'':' disabled')+'>Anterior</button><button id="sm" class="p">Saiba mais</button>'+(r?'<button id="rf">Refazer</button>':'')+'<span class="sp"></span><button id="nx"'+(i<pool.length-1?'':' disabled')+'>Próxima</button></div>';
 box.querySelectorAll('.alt').forEach(b=>b.onclick=()=>{const o=S.q[q.id]||{};S.q[q.id]={a:+b.dataset.k,ok:+b.dataset.k===q.g,t:Date.now(),n:(o.n||0)+1};save();render()});
 $('#pv').onclick=()=>{i--;save();render()};$('#nx').onclick=()=>{i++;save();render()};
 $('#sm').onclick=()=>{ci=0;card()};
 if(r)$('#rf').onclick=()=>{S.q[q.id]={a:null,t:Date.now(),n:S.q[q.id].n};save();render()};
 localStorage.setItem(K,JSON.stringify(S))}
function card(){const tp=T[pool[i].t],c=tp.cards[ci];$('#dt').textContent=tp.nome+' · card '+(ci+1)+' de '+tp.cards.length;$('#dh').textContent=c[0];$('#dp').textContent=c[1];$('#dpv').disabled=!ci;$('#dnx').disabled=ci>=tp.cards.length-1;if(!$('#dm').open)$('#dm').showModal()}
$('#dpv').onclick=()=>{ci--;card()};$('#dnx').onclick=()=>{ci++;card()};$('#dx').onclick=()=>$('#dm').close();
$('#cfg').onclick=()=>{$('#url').value=cfg.url||'';$('#dc').showModal()};$('#cx').onclick=()=>$('#dc').close();
$('#sv').onclick=()=>{cfg.url=$('#url').value.trim();localStorage.setItem(K+'.cfg',JSON.stringify(cfg));status('Sincronizando...');pull().then(()=>push())};
$('#fm').innerHTML='<option value="all">Todas as matérias</option>'+[...new Set(Q.map(q=>q.m))].map(m=>'<option>'+esc(m)+'</option>').join('');
$('#fm').onchange=$('#fo').onchange=()=>build(false);
build(true);pull();
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js');
</script></body></html>
